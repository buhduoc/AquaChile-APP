spring:
  application:
    name: AquaCheck-Backend

  datasource:
    url: ${AQUA_DB_URL:jdbc:mysql://127.0.0.1:3306/aquachile}
    username: ${AQUA_DB_USER:root}
    password: ${AQUA_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}